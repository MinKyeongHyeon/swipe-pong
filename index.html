<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel Puzzle</title>

    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #game {
        position: relative;
      }

      #board {
        display: grid;
        grid-template-columns: repeat(6, 40px);
        grid-template-rows: repeat(12, 40px);
        gap: 2px;
        background: #333;
        padding: 6px;
        position: relative;
      }

      .container {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }

      #scoreboard {
        width: 140px;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
      }

      #score-value {
        margin-top: 8px;
        font-size: 28px;
      }

      #start {
        position: absolute;
        top: 6px;
        right: -180px;
        padding: 6px 10px;
        border-radius: 6px;
        border: none;
        background: #2b7cff;
        color: #fff;
        cursor: pointer;
        z-index: 50;
      }
      #menu {
        position: absolute;
        top: 44px;
        right: -180px;
        padding: 6px 10px;
        border-radius: 6px;
        border: none;
        background: #444;
        color: #fff;
        cursor: pointer;
        z-index: 50;
      }

      #combo {
        position: absolute;
        top: -44px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: bold;
        min-width: 120px;
        text-align: center;
        display: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      }

      .cell {
        width: 40px;
        height: 40px;
        background: #222;
      }
      .R {
        background: crimson;
      }
      .G {
        background: seagreen;
      }
      .B {
        background: royalblue;
      }
      .Y {
        background: goldenrod;
      }

      .cursor {
        outline: 3px solid white;
        box-sizing: border-box;
      }

      .flash-white {
        background: #fff !important;
      }

      .floating {
        position: absolute;
        width: 40px;
        height: 40px;
        pointer-events: none;
        box-sizing: border-box;
      }

      #gameover {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 32px;
      }

      /* modal */
      .modal-overlay {
        position: absolute;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 200;
      }
      .modal-box {
        background: #222;
        color: #fff;
        padding: 16px;
        border-radius: 10px;
        width: 260px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }
      .modal-box h3 {
        margin: 0 0 8px 0;
      }
      .modal-btn {
        background: #333;
        color: #fff;
        border: none;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        text-align: left;
      }
      .modal-btn.primary {
        background: #2b7cff;
      }
      .modal-close {
        position: absolute;
        top: 8px;
        right: 8px;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
    <link rel="stylesheet" href="assets/retro.css" />
  </head>

  <body>
    <div class="container">
      <div id="scoreboard">
        <h3>Score</h3>
        <div id="score-value" role="status" aria-live="polite">0</div>
        <div
          id="highscore"
          style="margin-top: 8px; font-size: 12px; opacity: 0.8"
        >
          High:
          <span id="highscore-value" role="status" aria-live="polite">0</span>
        </div>
        <div id="level" style="margin-top: 8px; font-size: 12px; opacity: 0.9">
          Level:
          <span id="level-value" role="status" aria-live="polite">0</span>
        </div>
      </div>

      <div id="game">
        <button id="start" type="button" aria-label="Start game">Start</button>
        <button
          id="menu"
          type="button"
          aria-label="Open menu"
          aria-haspopup="dialog"
          aria-controls="pauseModal"
        >
          Menu
        </button>
        <canvas id="game-canvas"></canvas>
        <div id="board"></div>
        <div id="combo" style="display: none"></div>
        <!-- BGM: replace src with your audio file (e.g. assets/bgm.wav) -->
        <audio
          id="bgm"
          preload="auto"
          src="assets/bgm.wav"
          aria-hidden="true"
        ></audio>
        <div id="gameover">GAME OVER</div>
        <div
          id="pauseModal"
          class="modal-overlay"
          role="dialog"
          aria-modal="true"
          aria-hidden="true"
        >
          <div class="modal-box" role="document">
            <button
              class="modal-close"
              id="modalClose"
              aria-label="Close menu"
              type="button"
            >
              ×
            </button>
            <h3 id="menuTitle">Menu</h3>
            <button class="modal-btn" id="resumeBtn" type="button">
              Resume
            </button>
            <button class="modal-btn primary" id="restartBtn" type="button">
              Restart
            </button>
            <button class="modal-btn" id="settingBtn" type="button">
              Setting
            </button>
            <button class="modal-btn" id="titleBtn" type="button">
              Back to Title
            </button>
            <div id="settingsPanel" style="display: none; margin-top: 8px">
              <label for="bgmVol" style="font-size: 12px; opacity: 0.9"
                >BGM Volume</label
              >
              <input
                id="bgmVol"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                aria-label="BGM volume"
              />
              <label for="sfxVol" style="font-size: 12px; opacity: 0.9"
                >SFX Volume</label
              >
              <input
                id="sfxVol"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="SFX volume"
              />
              <button class="modal-btn" id="settingsBack" type="button">
                Back
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="assets/main.js"></script>
  </body>
</html>
